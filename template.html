<!doctype html><html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Display';src:url('__ANTON__') format('truetype');}
  @font-face{font-family:'Body';src:url('__INTER__') format('truetype');font-weight:100 900;}
  :root{
    --ink:#16181D; --cream:#F5F1EA; --accent:#C9992F; --white:#fff; --rule:#E2E5E9;
    --strip: __STRIPPX__;                  /* 0px when unbranded */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1024px;height:1024px;overflow:hidden}
  .canvas{position:relative;width:1024px;height:1024px;background:var(--cream);font-family:'Body',sans-serif;}
  .art{position:absolute;left:0;right:0;top:0;height:calc(100% - var(--strip));overflow:hidden}
  /* FIX (2026-09): added object-position so any object-fit:cover crop
     (needed once --strip shrinks this box below the plate's native square
     aspect ratio) removes pixels from the BOTTOM only. Previously defaulted
     to centered (50% 50%) cropping, which trimmed equally from top and
     bottom -- risking a bite out of the top margin the image prompts
     deliberately reserve (clean sky for full_bleed, the text-panel zone for
     price_banner). The bottom is the correct place to lose pixels: it's the
     same margin the prompts already ask Gemini to keep clean/simple when
     branding is on. */
  img.plate{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}

  /* ---------- shared type ---------- */
  .eyebrow{font-weight:700;font-size:26px;letter-spacing:4.5px;text-transform:uppercase;color:var(--accent)}
  .eyebrow.dark{color:var(--ink)}
  .headline{font-family:'Display';text-transform:uppercase;line-height:.88;letter-spacing:-1px}
  .sub{font-weight:500;font-size:30px;line-height:1.3}
  .btn{display:inline-block;background:var(--accent);color:var(--ink);font-weight:800;
       font-size:28px;padding:18px 34px}
  .link{font-weight:800;font-size:27px;color:var(--accent);border-bottom:3px solid var(--accent);
        display:inline-block;padding-bottom:5px}

  /* ---------- feature row (NEW: not in original starter kit) ---------- */
  /* Text-only row, no icon glyphs shipped in the starter kit's assets.
     Matches the layout of "price banner with a three icon feature row"
     reference, minus the icon artwork itself. */
  .features{position:absolute;left:0;right:0;bottom:var(--strip);display:flex;
            background:var(--white);border-top:2px solid var(--rule)}
  .features .feat{flex:1;text-align:center;padding:18px 8px;font-weight:700;
                   font-size:20px;letter-spacing:1px;color:var(--ink);
                   border-right:1px solid var(--rule)}
  .features .feat:last-child{border-right:none}

  /* ---------- A: price banner ---------- */
  .A .panel{position:absolute;top:0;left:0;right:0;height:30%;background:var(--cream);
            display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 44px;text-align:center}
  .A .photo{position:absolute;top:30%;left:0;right:0;bottom:0;overflow:hidden}
  /* FIX (2026-09, round 2): full bottom-anchoring (100%) over-corrected --
     it assumes ALL the excess height is safe-to-lose road/foreground, but
     when the roofline sits close to where the top-30% reservation ends,
     cropping that aggressively from the top clips into the roof itself.
     70% biases the crop toward the bottom (where the road actually is)
     while leaving real margin at the top so the roof isn't sitting right
     at the crop edge. This is a bias, not a guarantee -- house position
     still varies per generated plate, so re-check this against new plates
     rather than assuming it's perfect for every one. */
  .A .photo img{width:100%;height:100%;object-fit:cover;object-position:center 70%}
  .A .headline{color:var(--ink);font-size:150px;width:100%}
  .A .eyebrow{margin-bottom:14px}
  .A.has-features .photo{bottom:78px}
  .A.has-features .features{bottom:var(--strip)}

  /* ---------- B: split panel ---------- */
  .B .left{position:absolute;top:0;bottom:0;left:0;width:45%;background:var(--ink);
           display:flex;flex-direction:column;justify-content:center;padding:0 46px;gap:20px;overflow:hidden}
  .B .right{position:absolute;top:0;bottom:0;left:45%;right:0;overflow:hidden}
  /* FIX (2026-09): same object-position fix as img.plate above. */
  .B .right img{width:100%;height:100%;object-fit:cover;object-position:center top}
  .B .headline{font-size:86px;color:var(--white)}
  .B .headline .hl{color:var(--accent);display:block}
  .B .sub{color:var(--white);font-size:26px;opacity:.95}

  /* ---------- C: full bleed ---------- */
  .C .stack{position:absolute;top:0;left:0;right:0;max-height:42%;overflow:hidden;
            padding:28px 52px;text-align:left;
            background:linear-gradient(180deg, rgba(10,12,16,.72) 0%, rgba(10,12,16,.55) 55%, rgba(10,12,16,0) 100%)}
  .C .headline{font-size:132px;margin-bottom:10px}
  .C .headline{color:var(--white)} .C .sub{color:var(--white)}
  /* mood classes kept on the canvas element for any future per-mood tuning, but layout C no longer branches on them -- the scrim above makes both day and night legible without guessing local contrast at the exact spot the text sits over. */
  .C .headline .hl{color:var(--accent);display:block}
  .C .footlink{position:absolute;left:52px;bottom:calc(var(--strip) + 40px)}
  .C .sub{margin-top:6px}

  /* ---------- branding strip ---------- */
  .strip{position:absolute;left:0;right:0;bottom:0;height:var(--strip);background:var(--white);
         border-top:2px solid var(--rule);display:flex;align-items:center;justify-content:space-between;
         padding:0 calc(var(--strip) * 0.30)}
  .strip img{height:40%;width:auto;display:block}
  .strip .who{text-align:right;line-height:1.15}
  .strip .nm{font-weight:800;font-size:calc(var(--strip) * 0.27);color:var(--ink)}
  .strip .bk{font-weight:400;font-size:calc(var(--strip) * 0.21);color:#616B7A}
</style></head>
<body>
<div class="canvas __LAYOUT__ __MOOD__ __FEATCLASS__" id="canvas">__BODY__</div>

<script>
/* shrink-to-fit: the thing GraphicsMagick cannot do.
   Headlines vary from "FROM $575K" to "THE SUITE HELPS PAY THE MORTGAGE".
   Step the font size down until the text fits its box. */
(function(){
  document.querySelectorAll('.headline').forEach(function(el){
    var box = el.parentElement;
    // FIX (2026-09, round 2): only ever measured the HEADLINE's own
    // height against its box, with no idea that an eyebrow above and/or
    // a sub below sharing the same box were also taking up real space.
    // Invisible as long as every eyebrow/sub was a single short line, but
    // once one wraps, the combined siblings can exceed the box's fixed
    // height -- clipping content or bleeding it onto the photo.
    //
    // FIX (2026-09, round 3): .stack (Layout C) used to have NO fixed
    // height at all -- it auto-grew to match its own content, so this
    // budget subtraction was deliberately skipped there (subtracting
    // against a moving target collapsed the headline to the 24px floor
    // every time). .stack now has a real max-height + overflow:hidden
    // (see CSS) specifically so this check can finally apply to it too --
    // both eyebrow above AND sub below are now budgeted against, for
    // both .panel and .stack. .B .left is fixed-height too (top:0;
    // bottom:0) but was never broken by this, so left untouched.
    var isFixedHeightBox = box.classList.contains('panel') || box.classList.contains('stack');
    var eyebrowEl = isFixedHeightBox ? box.querySelector('.eyebrow') : null;
    var subEl = isFixedHeightBox ? box.querySelector('.sub') : null;
    var eyebrowHeight = eyebrowEl ? eyebrowEl.offsetHeight : 0;
    var subHeight = subEl ? subEl.offsetHeight : 0;
    var siblingHeight = eyebrowHeight + subHeight;
    var size = parseFloat(getComputedStyle(el).fontSize);
    var guard = 0;
    while ((el.scrollWidth > box.clientWidth - 14 || (siblingHeight + el.scrollHeight) > box.clientHeight - 14) && size > 24 && guard < 400){
      size -= 2; el.style.fontSize = size + 'px'; guard++;
    }
    el.setAttribute('data-final-size', Math.round(size));
  });
  window.__READY__ = true;
})();
</script>
</body></html>
